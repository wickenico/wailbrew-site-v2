version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    groups:
      radix-ui:
        patterns:
          - "@radix-ui/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      tailwindcss:
        patterns:
          - "tailwindcss"
          - "tailwind-merge"
          - "@tailwindcss/*"
          - "postcss"
      biome:
        patterns:
          - "@biomejs/*"
      vercel:
        patterns:
          - "@vercel/*"
      build-tools:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "typescript"
          - "@types/node"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "@radix-ui/*"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "tailwindcss"
          - "tailwind-merge"
          - "@tailwindcss/*"
          - "postcss"
          - "@biomejs/*"
          - "@vercel/*"
          - "vite"
          - "@vitejs/*"
          - "typescript"
          - "@types/node"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    groups:
      github-actions:
        patterns:
          - "*"
